services:
  - type: web
    name: elevare-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: https://your-vercel-app-url.vercel.app # TODO: Update this after Vercel deployment
